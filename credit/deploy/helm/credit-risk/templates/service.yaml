apiVersion: v1
kind: Service
metadata:
  name: {{ include "credit-risk.name" . }}
  labels:
    {{- include "credit-risk.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    track: stable
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
