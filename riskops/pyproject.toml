[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riskops"
version = "0.1.0"
description = "Dùng chung cho credit/ và fraud/: drift (PSI), số đo Prometheus, MLflow registry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "prometheus-client>=0.20"]

[project.optional-dependencies]
mlflow = ["mlflow-skinny>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
