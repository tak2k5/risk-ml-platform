# Cấu hình lint chung và test xuyên suốt ở gốc. Mỗi thư mục con có pyproject.toml riêng cho test của nó.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["**/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
pythonpath = ["credit/src", "credit", "fraud/src", "riskops/src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
